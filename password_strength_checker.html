<!DOCTYPE html>
<html>
  <head>
    <title>Password Strength Checker</title>

    <link
      rel="icon"
      href="https://cdn.glitch.global/14780529-cce6-4176-8e0b-db06f1a231d1/lock.png?v=1723559838778"
      type="image/x-icon"
    />

    <style>
      :root {
        --mc: white;
        --mt: blue;

        --bg: #f4f4f4;
        --container: #ffffff;
        --text: #333;
        --label: #555;
        --input: #ffffff;
        --input-text: #333;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;

        background-color: var(--bg);
        color: var(--text);

        margin: 0;
        min-height: 100vh;

        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* =========================
         MAIN CONTAINER
         ========================= */

      .login-container {
        width: 300px;

        margin: 150px auto;

        padding: 20px;

        background-color: var(--container);

        border: 1px solid var(--mt);

        border-radius: 5px;

        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;

        box-shadow:
          0 0 12px var(--mt);
      }

      .login-container h3 {
        text-align: center;

        color: var(--mt);

        transition: color 0.3s ease;
      }

      .login-form {
        margin-top: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;

        margin-bottom: 5px;

        color: var(--label);
      }

      .form-group input {
        width: 100%;

        padding: 8px;

        box-sizing: border-box;

        background-color: var(--input);
        color: var(--input-text);

        border: 1px solid var(--mt);
        border-radius: 3px;

        outline: none;

        transition:
          background-color 0.3s ease,
          color 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .form-group input:focus {
        box-shadow:
          0 0 8px var(--mt);
      }

      .form-group button {
        width: 100%;

        padding: 10px;

        background-color: var(--mt);

        color: #fff;

        border: none;

        border-radius: 3px;

        cursor: pointer;

        transition:
          background-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.1s ease;
      }

      .form-group button:hover {
        box-shadow:
          0 0 10px var(--mt);

        filter: brightness(0.9);
      }

      .form-group button:active {
        transform: scale(0.97);
      }

      #strength-score {
        font-weight: bold;

        margin-top: 10px;

        text-align: center;
      }

      /* =========================
         MORE FROM
         ========================= */

      h2 {
        text-align: center;

        color: var(--mt);

        transition: color 0.3s ease;
      }

      a {
        display: block;

        text-align: center;

        color: var(--mt);

        text-decoration: none;

        transition:
          color 0.3s ease,
          text-shadow 0.3s ease;
      }

      a:hover {
        text-shadow:
          0 0 8px var(--mt);
      }

      /* =========================
         DARK MODE
         ========================= */

      body.dark {
        --bg: #000;
        --container: #111;

        --text: var(--mt);
        --label: #ccc;

        --input: #222;
        --input-text: #fff;

        text-shadow:
          0 0 8px var(--mt);
      }

      body.dark .login-container {
        box-shadow:
          0 0 15px var(--mt),
          0 0 30px var(--mt);
      }

      body.dark .form-group input {
        box-shadow:
          0 0 6px rgba(255, 255, 255, 0.1);
      }

      /* =========================
         THEME SWITCH
         ========================= */

      .theme-switch {
        position: fixed;

        top: calc(env(safe-area-inset-top) + 21px);
        right: 15px;

        z-index: 1000;
      }

      .switch {
        position: relative;

        display: inline-block;

        width: 70px;
        height: 40px;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;

        inset: 0;

        cursor: pointer;

        background: white;

        border: 2px solid var(--mt);

        border-radius: 100px;

        transition: 0.3s;

        box-shadow:
          0 0 10px var(--mt),
          0 0 20px var(--mt);
      }

      .slider:before {
        content: "☀️";

        position: absolute;

        width: 30px;
        height: 30px;

        left: 2px;
        top: 3px;

        background: #888;

        border-radius: 50%;

        display: flex;

        justify-content: center;
        align-items: center;

        transition: 0.3s;

        font-size: 13px;

        box-shadow:
          0 0 8px var(--mt);
      }

      input:checked + .slider {
        background: #222;

        border-color: var(--mt);

        box-shadow:
          0 0 15px var(--mt),
          0 0 30px var(--mt);
      }

      input:checked + .slider:before {
        transform: translateX(32px);

        content: "🌙";

        background: #888;
      }

      /* =========================
         ACCENT SWITCH
         ========================= */

      .accent-switch {
        position: fixed;

        top: calc(env(safe-area-inset-top) + 21px);
        left: 15px;

        z-index: 1000;
      }

      .accents {
        position: relative;

        display: inline-block;

        width: 40px;
        height: 40px;
      }

      .aslider {
        position: absolute;

        inset: 0;

        cursor: pointer;

        background: white;

        border: 2px solid var(--mt);

        border-radius: 100px;

        transition: 0.3s;

        box-shadow:
          0 0 10px var(--mt),
          0 0 20px var(--mt);
      }

      .aslider:before {
        content: "🎨";

        position: absolute;

        width: 33px;
        height: 33px;

        left: 0;
        top: 0;

        background: rgba(255, 255, 255, 0);

        border-radius: 50%;

        display: flex;

        justify-content: center;
        align-items: center;

        transition: 0.3s;

        font-size: 13px;
      }

      /* =========================
         COLOR MENU
         ========================= */

      .colors {
        position: fixed;

        left: 65px;

        top: calc(env(safe-area-inset-top) + 12px);

        display: flex;

        gap: 8px;

        padding: 8px;

        border-radius: 30px;

        background: white;

        border: 2px solid var(--mt);

        box-shadow:
          0 0 12px var(--mt),
          0 5px 15px rgba(0, 0, 0, 0.2);

        opacity: 0;

        visibility: hidden;

        transform:
          translateX(-10px)
          scale(0.9);

        transition: 0.25s ease;
      }

      .colors.show {
        opacity: 1;

        visibility: visible;

        transform:
          translateX(0)
          scale(1);
      }

      .colors span {
        width: 30px;
        height: 30px;

        border-radius: 50%;

        cursor: pointer;

        border: 3px solid white;

        box-shadow:
          0 0 8px rgba(0, 0, 0, 0.2);

        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .colors span:hover {
        transform: scale(1.2);
      }

      /* =========================
         COLORS
         ========================= */

      .pink {
        background: #ff8fab;
      }

      .blue {
        background: #4facfe;
      }

      .purple {
        background: #9b5de5;
      }

      .green {
        background: #2ec4b6;
      }

      .lime {
        background: lime;
      }

      /* =========================
         DARK COLOR MENU
         ========================= */

      body.dark .colors {
        background: #111;

        box-shadow:
          0 0 15px var(--mt),
          0 0 30px var(--mt);
      }

      /* =========================
         MOBILE
         ========================= */

      @media (max-width: 500px) {
        .login-container {
          width: 90%;

          margin-top: 100px;
        }
      }
    </style>
  </head>

  <body>

    <!-- THEME SWITCH -->

    <div class="theme-switch">
      <label class="switch">
        <input
          type="checkbox"
          id="themeToggle"
        />

        <span class="slider"></span>
      </label>
    </div>


    <!-- ACCENT SWITCH -->

    <div
      class="accent-switch"
      onclick="acc()"
    >
      <label class="accents">
        <span class="aslider"></span>
      </label>
    </div>


    <!-- ACCENT COLORS -->

    <div
      class="colors"
      id="colors"
    >
      <span
        class="pink"
        onclick="setAccent('#ff8fab')"
      ></span>

      <span
        class="blue"
        onclick="setAccent('#4facfe')"
      ></span>

      <span
        class="purple"
        onclick="setAccent('#9b5de5')"
      ></span>

      <span
        class="green"
        onclick="setAccent('#2ec4b6')"
      ></span>

      <span
        class="lime"
        onclick="setAccent('lime')"
      ></span>
    </div>


    <!-- PASSWORD CHECKER -->

    <div class="login-container">

      <h3>Password Strength Checker</h3>

      <form
        class="login-form"
        action="#"
        method="post"
      >

        <div class="form-group">

          <label for="pas">
            Enter Password:
          </label>

          <input
            type="text"
            id="pas"
            name="pas"
            placeholder="Enter password"
            autocomplete="off"
          />

          <br />

          <label for="passpow">
            Password Strength:
          </label>

          <input
            type="text"
            id="passpow"
            name="passpow"
            readonly
          />

          <br /><br />

          <button
            type="button"
            onclick="fun_eval()"
          >
            Check
          </button>

          <br /><br />

          <button
            type="button"
            id="psc"
            style="background-color: gold"
            onclick="redr()"
          >
            Strong Password Generator
          </button>

          <br /><br />

          <button
            type="button"
            style="background-color: blue"
            onclick="window.location.href='vs.html'"
          >
            Home
          </button>

        </div>

      </form>

    </div>


    <h2>
      More from vaasudev mods:
    </h2>

    <a href="index.html">
      <b>
        ⇒Binary encoder and decoder free<br />
        ⇒Normal Calculator<br />
        ⇒Color Adder
      </b>
    </a>


    <script>

      /* =========================
         PASSWORD GENERATOR
         ========================= */

      function redr() {

        var reva =
          confirm(
            "Redirect to Password Genrator ?"
          );

        if (reva) {
          window.location.href =
            "Password_Genrator.html";
        }

      }


      /* =========================
         PASSWORD STRENGTH
         ========================= */

      document.getElementById(
        "passpow"
      ).value = "0/100";


      function fun_eval() {

        var password =
          document.getElementById(
            "pas"
          ).value;

        let score = 0;


        /* Length score */

        if (password.length >= 8)
          score += 20;

        if (password.length >= 12)
          score += 20;


        /* Character variety */

        if (/[a-z]/.test(password))
          score += 20;

        if (/[A-Z]/.test(password))
          score += 20;

        if (/[0-9]/.test(password))
          score += 20;

        if (/[^a-zA-Z0-9]/.test(password))
          score += 20;


        if (score > 100)
          score = "100+";


        document.getElementById(
          "passpow"
        ).value =
          `${score}/100`;

      }


      /* =========================
         THEME
         ========================= */

      const toggle =
        document.getElementById(
          "themeToggle"
        );

      const relm =
        document.documentElement;


      toggle.checked =
        localStorage.getItem(
          "theme"
        ) === "dark";


      document.body.classList.toggle(
        "dark",
        toggle.checked
      );


      function applyTheme() {

        if (toggle.checked) {

          relm.style.setProperty(
            "--mc",
            "black"
          );

          relm.style.setProperty(
            "--mt",
            localStorage.accent ||
            "lime"
          );

        } else {

          relm.style.setProperty(
            "--mc",
            "white"
          );

          relm.style.setProperty(
            "--mt",
            localStorage.accent ||
            "blue"
          );

        }

      }


      toggle.onchange = () => {

        document.body.classList.toggle(
          "dark",
          toggle.checked
        );

        localStorage.setItem(
          "theme",
          toggle.checked
            ? "dark"
            : "light"
        );

        applyTheme();

      };


      /* =========================
         KEYBOARD
         ========================= */

      document.addEventListener(
        "keydown",
        function (event) {

          /*
             Enter / =
             Password check
          */

          if (
            event.key === "Enter" ||
            event.key === "="
          ) {

            event.preventDefault();

            fun_eval();

          }


          /*
             Escape / C
             Clear
          */

          if (
            event.key === "Escape" ||
            event.key.toLowerCase() === "c"
          ) {

            document.getElementById(
              "pas"
            ).value = "";

            document.getElementById(
              "passpow"
            ).value = "0/100";

          }


          /*
             Alt
             Password generator
          */

          if (
            event.key.toLowerCase() === "alt"
          ) {

            document.getElementById(
              "psc"
            ).click();

          }

        }
      );


      /* =========================
         ACCENT
         ========================= */

      function setAccent(c) {

        document.documentElement.style.setProperty(
          "--mt",
          c
        );

        localStorage.accent = c;

      }


      if (localStorage.accent) {

        setAccent(
          localStorage.accent
        );

      } else {

        applyTheme();

      }


      /* =========================
         ACCENT MENU
         ========================= */

      function acc() {

        document
          .getElementById("colors")
          .classList.toggle("show");

      }

    </script>

  </body>
</html>
