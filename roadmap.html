<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap & Subjects 🌸</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* ☀️ Light Mode Styles */
        body {
            margin: 0;
            padding: 16px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6eb, #e4d7ff);
            font-family: "Segoe UI", sans-serif;
            color: #38234d;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* 🌙 Dark Mode Styles */
        body.dark-mode {
            background: linear-gradient(135deg, #181223, #281a38);
            color: #f3e5ff;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 16px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        body.dark-mode .header-bar {
            background: rgba(30, 20, 48, 0.65);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .section-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .subject-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }

        .unit-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        @media (max-width: 800px) {
            .header-bar {
                justify-content: center;
            }
            .subject-container, .unit-container {
                justify-content: center;
                margin-left: 0;
                width: 100%;
            }
            .divider {
                display: none;
            }
        }

        .divider {
            width: 2px;
            height: 24px;
            background: rgba(106, 52, 142, 0.25);
            flex-shrink: 0;
            border-radius: 2px;
            transition: background 0.4s ease;
        }

        body.dark-mode .divider {
            background: rgba(214, 162, 255, 0.25);
        }

        .section-label {
            font-weight: bold;
            font-size: 14px;
            color: #6a348e;
            white-space: nowrap;
            margin-right: 2px;
            flex-shrink: 0;
            transition: color 0.4s ease;
        }

        body.dark-mode .section-label {
            color: #d6a2ff;
        }

        .tab-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            padding: 6px 14px;
            border: 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #38234d;
            font-family: inherit;
        }

        body.dark-mode .tab-btn {
            background: rgba(48, 33, 70, 0.8);
            color: #e2cbff;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }

        body.dark-mode .tab-btn:hover {
            background: rgba(68, 48, 98, 0.9);
        }

        /* Subject Active Style */
        .tab-btn.subject-tab.active {
            background: #9b59b6;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
        }

        /* Unit Active Style */
        .tab-btn.unit-tab.active {
            background: #ff69b4;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
        }

        .delete-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.12);
            font-size: 11px;
            line-height: 1;
            margin-left: 2px;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }

        .tab-btn.active .delete-btn {
            background: rgba(255, 255, 255, 0.3);
        }

        .delete-btn:hover {
            background: #ff4757 !important;
            color: white !important;
            transform: scale(1.15);
        }

        .add-btn {
            font-weight: bold;
            font-size: 16px;
            color: #ff69b4;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
        }

        body.dark-mode .add-btn {
            background: rgba(60, 40, 85, 0.9);
            color: #ff85c0;
        }

        /* ☀️/🌙 Dark Mode Toggle Button */
        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 0;
            background: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        body.dark-mode .theme-toggle-btn {
            background: rgba(60, 40, 88, 0.9);
        }

        .theme-toggle-btn:hover {
            transform: scale(1.15) rotate(15deg);
        }

        textarea {
            width: 100%;
            height: calc(100vh - 100px);
            padding: 22px;
            border: 3px solid #d787ff;
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.88);
            font-family: Consolas, monospace;
            font-size: 20px;
            line-height: 1.6;
            color: #38234d;
            resize: none;
            box-shadow: 0 10px 30px rgba(120, 50, 160, 0.2);
            transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.4s ease;
        }

        body.dark-mode textarea {
            background: rgba(25, 18, 38, 0.92);
            border-color: #9b59b6;
            color: #f3e5ff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        textarea:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        /* 🌸 Custom Spring Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(40, 20, 60, 0.45);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(120, 50, 160, 0.3);
            border: 3px solid #ffd6eb;
            transform: scale(0.6) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease, border-color 0.4s ease;
        }

        body.dark-mode .modal-card {
            background: #20172e;
            border-color: #9b59b6;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #7d449e;
            margin-bottom: 12px;
            transition: color 0.4s ease;
        }

        body.dark-mode .modal-title {
            color: #e2cbff;
        }

        .modal-text {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.5;
            transition: color 0.4s ease;
        }

        body.dark-mode .modal-text {
            color: #cbb8e3;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d787ff;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            color: #38234d;
            font-family: inherit;
            transition: border-color 0.2s ease, background 0.4s ease, color 0.4s ease;
        }

        body.dark-mode .modal-input {
            background: #2a1f3d;
            border-color: #9b59b6;
            color: #f3e5ff;
        }

        .modal-input:focus {
            border-color: #ff69b4;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 22px;
            border: 0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .btn-cancel {
            background: #ffffff;
            color: #6a348e;
            border: 2px solid #e4d7ff;
        }

        body.dark-mode .btn-cancel {
            background: #2a1f3d;
            color: #e2cbff;
            border-color: #533678;
        }

        .btn-cancel:hover {
            background: #f8f5ff;
        }

        body.dark-mode .btn-cancel:hover {
            background: #382a52;
        }

        .btn-action {
            background: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.35);
        }

        .btn-primary {
            background: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.35);
        }
    </style>
</head>
<body>

    <!-- Header Bar with Theme Toggle -->
    <div class="header-bar">
        <!-- Subjects Section -->
        <div class="subject-container">
            <span class="section-label">📚</span>
            <div id="subjectTabs" class="section-group"></div>
        </div>

        <!-- Divider Line -->
        <div class="divider"></div>

        <!-- Units Section -->
        <div class="unit-container">
            <span class="section-label">🌸</span>
            <div id="unitTabs" class="section-group"></div>
        </div>

        <!-- ☀️/🌙 Theme Toggle Button -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">☀️</button>
    </div>

    <textarea
        id="roadmap"
        spellcheck="false"
        placeholder="Paste roadmap here~ 🌸"
    ></textarea>

    <!-- Custom Kawaii Spring Popup Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-card" id="modalCard">
            <div class="modal-title" id="modalTitle">Title 🌸</div>
            <div class="modal-text" id="modalMessage">Message content goes here...</div>
            <input type="text" id="modalInput" class="modal-input" placeholder="Type name..." style="display: none;" />
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-action" id="modalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const roadmap = document.getElementById("roadmap");
        const subjectTabs = document.getElementById("subjectTabs");
        const unitTabs = document.getElementById("unitTabs");
        const customModal = document.getElementById("customModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMessage = document.getElementById("modalMessage");
        const modalInput = document.getElementById("modalInput");
        const modalConfirmBtn = document.getElementById("modalConfirmBtn");
        const themeToggleBtn = document.getElementById("themeToggleBtn");

        // 🌙 Dark Mode State Management
        let isDarkMode = localStorage.getItem("roadmap-theme") === "dark";

        function applyTheme() {
            if (isDarkMode) {
                document.body.classList.add("dark-mode");
                themeToggleBtn.textContent = "🌙";
            } else {
                document.body.classList.remove("dark-mode");
                themeToggleBtn.textContent = "☀️";
            }
        }

        themeToggleBtn.onclick = () => {
            isDarkMode = !isDarkMode;
            localStorage.setItem("roadmap-theme", isDarkMode ? "dark" : "light");
            applyTheme();
        };

        // App Data State
        let data = JSON.parse(localStorage.getItem("roadmap-app-data")) || {
            currentSubjectId: "subj_1",
            subjects: [
                {
                    id: "subj_1",
                    name: "Subject 1",
                    currentUnitId: "u_1",
                    units: [
                        { id: "u_1", name: "U1", content: "" }
                    ]
                }
            ]
        };

        let currentModalAction = null;

        function saveData() {
            localStorage.setItem("roadmap-app-data", JSON.stringify(data));
        }

        function getCurrentSubject() {
            return data.subjects.find(s => s.id === data.currentSubjectId) || data.subjects[0];
        }

        function getCurrentUnit(subject) {
            return subject.units.find(u => u.id === subject.currentUnitId) || subject.units[0];
        }

        function saveCurrentText() {
            const subject = getCurrentSubject();
            if (subject) {
                const unit = getCurrentUnit(subject);
                if (unit) {
                    unit.content = roadmap.value;
                    saveData();
                }
            }
        }

        function render() {
            const currentSubj = getCurrentSubject();

            // 1. Render Subjects
            subjectTabs.innerHTML = "";
            data.subjects.forEach(subj => {
                const btn = document.createElement("button");
                btn.className = `tab-btn subject-tab ${subj.id === data.currentSubjectId ? "active" : ""}`;
                
                const label = document.createElement("span");
                label.textContent = subj.name;
                btn.appendChild(label);

                if (data.subjects.length > 1) {
                    const del = document.createElement("span");
                    del.className = "delete-btn";
                    del.textContent = "✕";
                    del.onclick = (e) => {
                        e.stopPropagation();
                        openDeleteModal("subject", subj.id);
                    };
                    btn.appendChild(del);
                }

                btn.onclick = () => switchSubject(subj.id);
                subjectTabs.appendChild(btn);
            });

            const addSubBtn = document.createElement("button");
            addSubBtn.className = "tab-btn add-btn";
            addSubBtn.textContent = "+";
            addSubBtn.onclick = openAddSubjectModal;
            subjectTabs.appendChild(addSubBtn);

            // 2. Render Units
            unitTabs.innerHTML = "";
            if (currentSubj) {
                currentSubj.units.forEach(unit => {
                    const btn = document.createElement("button");
                    btn.className = `tab-btn unit-tab ${unit.id === currentSubj.currentUnitId ? "active" : ""}`;
                    
                    const label = document.createElement("span");
                    label.textContent = unit.name;
                    btn.appendChild(label);

                    if (currentSubj.units.length > 1) {
                        const del = document.createElement("span");
                        del.className = "delete-btn";
                        del.textContent = "✕";
                        del.onclick = (e) => {
                            e.stopPropagation();
                            openDeleteModal("unit", currentSubj.id, unit.id);
                        };
                        btn.appendChild(del);
                    }

                    btn.onclick = () => switchUnit(unit.id);
                    unitTabs.appendChild(btn);
                });

                const addUnitBtn = document.createElement("button");
                addUnitBtn.className = "tab-btn add-btn";
                addUnitBtn.textContent = "+";
                addUnitBtn.onclick = addUnit;
                unitTabs.appendChild(addUnitBtn);

                const activeUnit = getCurrentUnit(currentSubj);
                roadmap.value = activeUnit ? activeUnit.content : "";
            }
        }

        function switchSubject(subjectId) {
            saveCurrentText();
            data.currentSubjectId = subjectId;
            saveData();
            render();
            roadmap.focus();
        }

        function switchUnit(unitId) {
            saveCurrentText();
            const subject = getCurrentSubject();
            subject.currentUnitId = unitId;
            saveData();
            render();
            roadmap.focus();
        }

        function addUnit() {
            saveCurrentText();
            const subject = getCurrentSubject();
            const unitNumber = subject.units.length + 1;
            const newUnitId = `u_${Date.now()}`;

            subject.units.push({
                id: newUnitId,
                name: `U${unitNumber}`,
                content: ""
            });

            subject.currentUnitId = newUnitId;
            saveData();
            render();
            roadmap.focus();
        }

        // --- Custom Spring Modal System ---
        function openModal() {
            customModal.classList.add("active");
        }

        function closeModal() {
            customModal.classList.remove("active");
            currentModalAction = null;
        }

        function openDeleteModal(type, subjectId, unitId = null) {
            modalInput.style.display = "none";
            modalConfirmBtn.className = "modal-btn btn-action";
            modalConfirmBtn.textContent = "Delete 🗑️";

            if (type === "subject") {
                const subj = data.subjects.find(s => s.id === subjectId);
                modalTitle.textContent = "Delete Subject? 🗑️";
                modalMessage.textContent = `Are you sure you want to delete "${subj ? subj.name : 'this subject'}" and all its units?`;
            } else {
                const subj = data.subjects.find(s => s.id === subjectId);
                const unit = subj ? subj.units.find(u => u.id === unitId) : null;
                modalTitle.textContent = "Delete Unit? 🗑️";
                modalMessage.textContent = `Are you sure you want to delete "${unit ? unit.name : 'this unit'}"?`;
            }

            currentModalAction = () => {
                saveCurrentText();
                if (type === "subject") {
                    data.subjects = data.subjects.filter(s => s.id !== subjectId);
                    if (data.currentSubjectId === subjectId) {
                        data.currentSubjectId = data.subjects[0].id;
                    }
                } else if (type === "unit") {
                    const subj = data.subjects.find(s => s.id === subjectId);
                    if (subj) {
                        subj.units = subj.units.filter(u => u.id !== unitId);
                        if (subj.currentUnitId === unitId) {
                            subj.currentUnitId = subj.units[0].id;
                        }
                    }
                }
                saveData();
                render();
            };

            openModal();
        }

        function openAddSubjectModal() {
            const count = data.subjects.length + 1;
            modalTitle.textContent = "New Subject 🌸";
            modalMessage.textContent = "Enter the name for your new subject:";
            modalInput.style.display = "block";
            modalInput.value = `Subject ${count}`;
            modalConfirmBtn.className = "modal-btn btn-primary";
            modalConfirmBtn.textContent = "Create ✨";

            currentModalAction = () => {
                const name = modalInput.value.trim();
                if (!name) return;

                saveCurrentText();
                const newSubjId = `subj_${Date.now()}`;
                const newUnitId = `u_${Date.now()}`;

                data.subjects.push({
                    id: newSubjId,
                    name: name,
                    currentUnitId: newUnitId,
                    units: [{ id: newUnitId, name: "U1", content: "" }]
                });

                data.currentSubjectId = newSubjId;
                saveData();
                render();
                roadmap.focus();
            };

            openModal();
            setTimeout(() => {
                modalInput.focus();
                modalInput.select();
            }, 100);
        }

        modalConfirmBtn.onclick = () => {
            if (currentModalAction) {
                currentModalAction();
            }
            closeModal();
        };

        customModal.addEventListener("click", (e) => {
            if (e.target === customModal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (customModal.classList.contains("active")) {
                if (e.key === "Escape") {
                    closeModal();
                } else if (e.key === "Enter" && modalInput.style.display !== "none") {
                    modalConfirmBtn.click();
                }
            }
        });

        roadmap.addEventListener("input", saveCurrentText);

        // Initial Load
        applyTheme();
        render();
    </script>
</body>
</html>
