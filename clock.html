<!DOCTYPE html>
<html>
  <head>
    <title>Clock 🕒</title>
     
    <link rel="icon" href="https://www.transparentpng.com/download/time/time-icons--time-icon-clock-png-5.png" type="image/png" />
   
    <style>
     body {
    font-size: xx-large;
    margin: 0;
    height: 100vh;           /* full screen height */
    display: flex;           /* enable flexbox */
    justify-content: center; /* center horizontally */
    align-items: center;     /* center vertically */
    background-color: rgb(100, 255, 100);
    color: blue;
    transition: background-color .3s ease,
                color .3s ease;
  }
  h1{
    display: block;
  }
  #time {
  transition: 0.2s ease;
}
#time {
  font-size: 15vw;     /* scales with screen width */
  margin: 0 2vw;       /* small space on left & right */
  text-align: center;  /* center the text */
  user-select: none;
}
.switch input{
    display:none;
}

body.dark{
  background-color: black;
  color:lime;
  text-shadow:0 0 15px lime;
}

.slider{
    position:absolute;
    inset:0;
    cursor:pointer;
    background:rgb(100, 255, 100);
    border:2px solid green;
    border-radius:30px;
    transition:.3s;
}

.slider:before{
    content:"☀️";
    position:absolute;
    width:22px;
    height:22px;
    left:2px;
    top:2px;
    background:rgba(255, 255, 255, 0.502);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
    font-size:13px;
}

input:checked + .slider{
    background:#333;
    border-color:#666;
}

input:checked + .slider:before{
    transform:translateX(24px);
    content:"🌙";
}
.theme-switch{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 12px);
    right:15px;
    z-index:1000;
}

.switch{
    position:relative;
    display:inline-block;
    width:54px;
    height:30px;
}


    </style>
  </head>
  <body>
    <div class="theme-switch">
    <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>
</div>
    <h1 id="time"></h1>
    <script>
      function updateTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        hours = hours ? hours : 12; // The hour '0' should be '12'
        const currentTime = `${hours}:${minutes}:${seconds} ${ampm}`;
        //document.getElementById("time-container").textContent = currentTime;
        document.getElementById("time").textContent = currentTime;
      }

      //setInterval(updateTime, 1000); // Update time every second
      //updateTime();
      function tick() {
    updateTime();
    setTimeout(tick, 1000 - new Date().getMilliseconds());
}
tick();

      const toggle = document.getElementById("themeToggle");

toggle.checked = localStorage.getItem("theme") === "dark";
document.body.classList.toggle("dark", toggle.checked);

toggle.onchange = () => {
    document.body.classList.toggle("dark", toggle.checked);
    localStorage.setItem("theme", toggle.checked ? "dark" : "light");
};
    </script>
  </body>
</html>
