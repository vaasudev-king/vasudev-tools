<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Honest Password Strength Checker</title>

<style>

:root {
  --mc: white;
  --mt: blue;

  --bg: #f4f4f4;
  --container: #ffffff;
  --text: #333;
  --input: #ffffff;
  --input-text: #333;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;

  background: var(--bg);
  color: var(--text);

  margin: 0;
  min-height: 100vh;

  transition:
    background-color .3s ease,
    color .3s ease;
}


/* =========================
   MAIN BOX
   ========================= */

.box {
  width: 340px;

  margin: 120px auto;

  background: var(--container);

  padding: 20px;

  border-radius: 6px;

  border: 1px solid var(--mt);

  transition:
    background-color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;

  box-shadow:
    0 0 12px var(--mt);
}


h3 {
  text-align: center;
  color: var(--mt);

  transition: color .3s ease;
}


label {
  display: block;
  margin-top: 10px;
}


/* =========================
   INPUTS
   ========================= */

input[type="number"],
input[type="text"] {

  width: 100%;

  padding: 8px;

  margin-top: 4px;

  background: var(--input);
  color: var(--input-text);

  border: 1px solid var(--mt);

  border-radius: 4px;

  outline: none;

  transition:
    background-color .3s ease,
    color .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}


input[type="number"]:focus,
input[type="text"]:focus {

  box-shadow:
    0 0 8px var(--mt);
}


/* =========================
   BUTTONS
   ========================= */

button {

  width: 100%;

  padding: 10px;

  margin-top: 10px;

  border: none;

  border-radius: 4px;

  cursor: pointer;

  color: white;

  transition:
    box-shadow .2s ease,
    transform .1s ease,
    filter .2s ease;
}


button:hover {

  box-shadow:
    0 0 10px var(--mt);

  filter: brightness(.9);
}


button:active {
  transform: scale(.97);
}


/* =========================
   ORIGINAL BUTTON COLORS
   ========================= */

.green {
  background: #4caf50;
}

.blue {
  background: #2196f3;
}

.red {
  background: #f44336;
}


/* =========================
   STRENGTH
   ========================= */

#strength {

  margin-top: 12px;

  text-align: center;

  font-weight: bold;

  color: var(--mt);

  transition:
    color .3s ease,
    text-shadow .3s ease;
}


/* =========================
   DARK MODE
   ========================= */

body.dark {

  --bg: #000;
  --container: #111;

  --text: var(--mt);

  --input: #222;
  --input-text: white;

  text-shadow:
    0 0 8px var(--mt);
}


body.dark .box {

  box-shadow:
    0 0 15px var(--mt),
    0 0 30px var(--mt);
}


body.dark #strength {

  text-shadow:
    0 0 8px var(--mt);
}


/* =========================
   THEME SWITCH
   ========================= */

.theme-switch {

  position: fixed;

  top: calc(env(safe-area-inset-top) + 21px);

  right: 15px;

  z-index: 1000;
}


.switch {

  position: relative;

  display: inline-block;

  width: 70px;

  height: 40px;
}


.switch input {
  display: none;
}


.slider {

  position: absolute;

  inset: 0;

  cursor: pointer;

  background: white;

  border: 2px solid var(--mt);

  border-radius: 100px;

  transition: .3s;

  box-shadow:
    0 0 10px var(--mt),
    0 0 20px var(--mt);
}


/* GREY KNOB */

.slider:before {

  content: "☀️";

  position: absolute;

  width: 30px;
  height: 30px;

  left: 2px;
  top: 3px;

  background: #888;

  border-radius: 50%;

  display: flex;

  justify-content: center;
  align-items: center;

  transition: .3s;

  font-size: 13px;

  box-shadow:
    0 0 8px var(--mt);
}


input:checked + .slider {

  background: #222;

  border-color: var(--mt);

  box-shadow:
    0 0 15px var(--mt),
    0 0 30px var(--mt);
}


input:checked + .slider:before {

  transform: translateX(32px);

  content: "🌙";

  background: #888;
}


/* =========================
   ACCENT SWITCH
   ========================= */

.accent-switch {

  position: fixed;

  top: calc(env(safe-area-inset-top) + 21px);

  left: 15px;

  z-index: 1000;
}


.accents {

  position: relative;

  display: inline-block;

  width: 40px;

  height: 40px;
}


.aslider {

  position: absolute;

  inset: 0;

  cursor: pointer;

  background: white;

  border: 2px solid var(--mt);

  border-radius: 100px;

  transition: .3s;

  box-shadow:
    0 0 10px var(--mt),
    0 0 20px var(--mt);
}


.aslider:before {

  content: "🎨";

  position: absolute;

  width: 33px;
  height: 33px;

  left: 0;
  top: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 13px;
}


/* =========================
   COLOR MENU
   ========================= */

.colors {

  position: fixed;

  left: 65px;

  top: calc(env(safe-area-inset-top) + 12px);

  display: flex;

  gap: 8px;

  padding: 8px;

  border-radius: 30px;

  background: white;

  border: 2px solid var(--mt);

  box-shadow:
    0 0 12px var(--mt),
    0 5px 15px rgba(0,0,0,.2);

  opacity: 0;

  visibility: hidden;

  transform:
    translateX(-10px)
    scale(.9);

  transition: .25s ease;
}


.colors.show {

  opacity: 1;

  visibility: visible;

  transform:
    translateX(0)
    scale(1);
}


.colors span {

  width: 30px;
  height: 30px;

  border-radius: 50%;

  cursor: pointer;

  border: 3px solid white;

  box-shadow:
    0 0 8px rgba(0,0,0,.2);

  transition:
    transform .2s,
    box-shadow .2s;
}


.colors span:hover {

  transform: scale(1.2);

  box-shadow:
    0 0 12px var(--mt);
}


/* =========================
   COLORS
   ========================= */

.pink {
  background: #ff8fab;
}

.blue {
  background: #4facfe;
}

.purple {
  background: #9b5de5;
}

.green {
  background: #2ec4b6;
}

.lime {
  background: lime;
}


/* =========================
   DARK COLOR MENU
   ========================= */

body.dark .colors {

  background: #111;

  box-shadow:
    0 0 15px var(--mt),
    0 0 30px var(--mt);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 500px) {

  .box {
    width: 90%;
    margin-top: 100px;
  }

}

.custom-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}

.custom-checkbox input {
  display: none;
}

.custom-slider {
  width: 48px;
  height: 26px;

  background: #888;

  border-radius: 30px;

  position: relative;

  transition:
    background-color .3s ease,
    box-shadow .3s ease;
}

.custom-slider::before {
  content: "";

  position: absolute;

  width: 20px;
  height: 20px;

  left: 3px;
  top: 3px;

  background: white;

  border-radius: 50%;

  transition:
    transform .3s ease;
}

.custom-checkbox input:checked + .custom-slider {
  background: var(--mt);

  box-shadow:
    0 0 10px var(--mt),
    0 0 20px var(--mt);
}

.custom-checkbox input:checked + .custom-slider::before {
  transform: translateX(22px);
}

</style>
</head>


<body>


<!-- THEME SWITCH -->

<div class="theme-switch">

  <label class="switch">

    <input
      type="checkbox"
      id="themeToggle"
    >

    <span class="slider"></span>

  </label>

</div>


<!-- ACCENT SWITCH -->

<div
  class="accent-switch"
  onclick="acc()"
>

  <label class="accents">

    <span class="aslider"></span>

  </label>

</div>


<!-- ACCENT COLORS -->

<div
  class="colors"
  id="colors"
>

  <span
    class="pink"
    onclick="setAccent('#ff8fab')"
  ></span>

  <span
    class="blue"
    onclick="setAccent('#4facfe')"
  ></span>

  <span
    class="purple"
    onclick="setAccent('#9b5de5')"
  ></span>

  <span
    class="green"
    onclick="setAccent('#2ec4b6')"
  ></span>

  <span
    class="lime"
    onclick="setAccent('lime')"
  ></span>

</div>


<!-- MAIN -->

<div class="box">

  <h3>
    Honest Password Generator
  </h3>


  <label>
    Password Length
  </label>

  <input
    type="number"
    id="len"
    placeholder="8 - 50"
  >


  <label>
    Generated Password
  </label>

  <input
    type="text"
    id="pwd"
    readonly
  >


  <label class="custom-checkbox">
  <input type="checkbox" id="long">
  <span class="custom-slider"></span>
  <span>Allow extra-long (up to 50)</span>
</label>


  </label>


  <button
    class="green"
    onclick="generate()"
  >
    Generate
  </button>


  <button
    class="blue"
    onclick="copyPwd()"
  >
    Copy
  </button>


  <button
    class="red"
    onclick="clearAll()"
  >
    Clear
  </button>


  <div id="strength">
    Strength: 0
  </div>

</div>


<script>

/* =========================
   PASSWORD GENERATOR
   ========================= */

const charset =
"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";


function secureRandom(max) {

  const a =
    new Uint32Array(1);

  crypto.getRandomValues(a);

  return a[0] % max;
}


function generate() {

  const lenInput =
    document.getElementById("len");

  const out =
    document.getElementById("pwd");

  const allowLong =
    document.getElementById("long").checked;


  let maxLen =
    allowLong ? 50 : 30;

  let len =
    parseInt(lenInput.value);


  if (!len || len < 8) {

    alert(
      "Minimum length is 8"
    );

    return;
  }


  if (len > maxLen) {

    len = maxLen;

    lenInput.value =
      maxLen;
  }


  let pwd = "";


  for (
    let i = 0;
    i < len;
    i++
  ) {

    pwd +=
      charset.charAt(
        secureRandom(
          charset.length
        )
      );

  }


  out.value = pwd;

  evaluateStrength(pwd);
}


/* =========================
   STRENGTH
   ========================= */

function evaluateStrength(pwd) {

  let score = 0;


  /* 🔥 HONEST WEIGHTING 🔥 */

  /* Length */

  if (pwd.length >= 8)
    score += 15;

  if (pwd.length >= 12)
    score += 20;

  if (pwd.length >= 16)
    score += 25;

  if (pwd.length >= 24)
    score += 30;


  /* Character diversity */

  if (/[a-z]/.test(pwd))
    score += 10;

  if (/[A-Z]/.test(pwd))
    score += 10;

  if (/[0-9]/.test(pwd))
    score += 10;

  if (/[^a-zA-Z0-9]/.test(pwd))
    score += 10;


  /* Weak patterns */

  if (/(.)\1{2,}/.test(pwd))
    score -= 15;

  if (/1234|abcd|qwer/i.test(pwd))
    score -= 20;

  if (/^[A-Za-z]+\d+$/.test(pwd))
    score -= 10;

  if (/password|admin|login/i.test(pwd))
    score -= 40;


  /* Label */

  let label =
    "🟢 Strong";


  if (score < 0)
    label =
      "💀 Extremely Weak";

  else if (score < 30)
    label =
      "🔴 Weak";

  else if (score < 60)
    label =
      "🟠 Medium";

  else if (score < 100)
    label =
      "🟡 Very Strong";

  else if (score >= 100)
    label =
      "🔥 Insane";


  document.getElementById(
    "strength"
  ).innerText =
    `Strength: ${score} (${label})`;
}


/* =========================
   COPY
   ========================= */

function copyPwd() {

  const p =
    document.getElementById(
      "pwd"
    ).value;


  if (!p)
    return;


  navigator.clipboard
    .writeText(p);


  alert("Copied!");
}


/* =========================
   CLEAR
   ========================= */

function clearAll() {

  document.getElementById(
    "pwd"
  ).value = "";


  document.getElementById(
    "strength"
  ).innerText =
    "Strength: 0";
}


/* =========================
   THEME
   ========================= */

const toggle =
  document.getElementById(
    "themeToggle"
  );


const relm =
  document.documentElement;


toggle.checked =
  localStorage.getItem(
    "theme"
  ) === "dark";


document.body.classList.toggle(
  "dark",
  toggle.checked
);


function applyTheme() {

  if (toggle.checked) {

    relm.style.setProperty(
      "--mc",
      "black"
    );

    relm.style.setProperty(
      "--mt",
      localStorage.accent ||
      "lime"
    );

  }

  else {

    relm.style.setProperty(
      "--mc",
      "white"
    );

    relm.style.setProperty(
      "--mt",
      localStorage.accent ||
      "blue"
    );

  }

}


toggle.onchange = () => {

  document.body.classList.toggle(
    "dark",
    toggle.checked
  );


  localStorage.setItem(
    "theme",
    toggle.checked
      ? "dark"
      : "light"
  );


  applyTheme();

};


/* =========================
   ACCENT
   ========================= */

function setAccent(c) {

  document.documentElement
    .style
    .setProperty(
      "--mt",
      c
    );


  localStorage.accent =
    c;
}


if (localStorage.accent) {

  setAccent(
    localStorage.accent
  );

}

else {

  applyTheme();

}


/* =========================
   ACCENT MENU
   ========================= */

function acc() {

  document
    .getElementById("colors")
    .classList
    .toggle("show");

}

</script>

</body>
</html>
